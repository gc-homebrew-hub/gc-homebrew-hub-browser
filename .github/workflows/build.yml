# Builds boot.dol in the libogc2 image (the same command as README.md), runs
# the host tests, and attaches the SD card folder to the run as an artifact.
name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      crash_pc:
        description: "Addresses to look up in boot.elf (a crash's PC or LR, e.g. 0x801a6d78) or function names to disassemble, separated by spaces"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch mbedTLS
        run: ./get-deps.sh

      # (GitHub runs bash with pipefail, so a failed make fails the step)
      - name: Build boot.dol
        run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/extremscorner/libogc2:latest \
            sh -c 'make && make package' 2>&1 | tee build.log

      # The build must stay warning-free (our sources; mbedTLS is not ours)
      - name: Check for warnings
        run: |
          if grep -E "/source/[^ ]*: *warning:|^source/[^ ]*: *warning:" build.log; then
            echo "::error::The build has warnings in source/"
            exit 1
          fi

      # Turns crash addresses (Dolphin's "PC = ...", or a backtrace) into
      # function and line, against the boot.elf this run built
      - name: Look up crash addresses
        if: ${{ inputs.crash_pc != '' }}
        env:
          CRASH_PC: ${{ inputs.crash_pc }}
        run: |
          docker run --rm -e CRASH_PC -v "$PWD:/src" -w /src ghcr.io/extremscorner/libogc2:latest sh -c '
            for a in $CRASH_PC; do
              echo "== $a"
              case "$a" in
              0x*)
                $DEVKITPPC/bin/powerpc-eabi-addr2line -f -i -C -e boot.elf "$a"
                s=$(printf "0x%x" $(( a - 0x40 ))); e=$(printf "0x%x" $(( a + 0x20 )))
                $DEVKITPPC/bin/powerpc-eabi-objdump -d -l --start-address=$s --stop-address=$e boot.elf | tail -n +7 ;;
              *)
                # a function name: disassemble all of it
                $DEVKITPPC/bin/powerpc-eabi-objdump -d --disassemble="$a" boot.elf | tail -n +7 ;;
              esac
            done'

      - name: Host tests
        run: make test

      - uses: actions/upload-artifact@v4
        with:
          name: gc-homebrew-hub-browser-${{ github.sha }}
          path: package/
          if-no-files-found: error

      # The symbols that go with this boot.dol, for looking up crashes later
      - uses: actions/upload-artifact@v4
        with:
          name: gc-homebrew-hub-browser-symbols-${{ github.sha }}
          path: |
            boot.elf
            build/boot.elf.map
          if-no-files-found: warn
